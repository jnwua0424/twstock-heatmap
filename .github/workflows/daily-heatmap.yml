name: 台股族群熱力圖

on:
  schedule:
    # GitHub 用 UTC 時間，週一到週五
    - cron: "0 8 * * 1-5"     # 台灣 16:00
    - cron: "30 10 * * 1-5"   # 台灣 18:30（補救：16:00 那次資料還沒更新時再試一次）
  workflow_dispatch:          # 在 Actions 頁面手動執行
    inputs:
      date:
        description: "補跑指定日期 YYYYMMDD（例如 20261012），留空＝抓今天"
        required: false
        default: ""

permissions:
  contents: write      # 讓流程可以把產出的 HTML 存回 repo

jobs:
  build:
    runs-on: ubuntu-24.04   # 鎖定版本，避免 ubuntu-latest 換成 26 後環境改變
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行程式
        env:
          RUN_DATE: ${{ inputs.date }}
        run: |
          set +e
          python twstock_group_heatmap.py $RUN_DATE
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "::warning::資料還不是今天的（尚未更新或今日休市），本次沒有產出檔案"
            exit 0
          fi
          exit $code

      - name: 整理輸出（最新一份 + 歷史紀錄）
        if: hashFiles('twstock_group_heatmap_*.html') != ''
        run: |
          mkdir -p docs/archive
          mv twstock_group_heatmap_*.html docs/archive/
          # 首頁永遠放「日期最新」的那份，補跑舊日期不會蓋掉首頁
          latest=$(ls docs/archive/twstock_group_heatmap_*.html | sort | tail -1)
          cp "$latest" docs/index.html
          python - <<'PY'
          import pathlib
          files = sorted(pathlib.Path("docs/archive").glob("twstock_group_heatmap_*.html"), reverse=True)
          items = "".join(
              f'<li><a href="{p.name}">{p.stem.split("_")[-1]}</a></li>' for p in files
          )
          page = (
              "<!doctype html><meta charset='utf-8'>"
              "<meta name='viewport' content='width=device-width,initial-scale=1'>"
              "<title>歷史熱力圖</title>"
              "<body style='background:#111;color:#eee;font-family:sans-serif;line-height:2'>"
              "<h2>歷史熱力圖</h2><p><a style='color:#6af' href='../'>← 回最新一份</a></p>"
              f"<ul>{items}</ul>"
          ).replace("<a href", "<a style='color:#6af' href")
          pathlib.Path("docs/archive/index.html").write_text(page, encoding="utf-8")
          PY

      - name: 存回 repo
        if: hashFiles('docs/archive/*.html') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "更新熱力圖 $(date +%F)"
          git push
