name: 台股族群熱力圖

on:
  schedule:
    # GitHub 用 UTC 時間：08:00 UTC = 台灣 16:00，週一到週五
    - cron: "0 8 * * 1-5"
  workflow_dispatch:   # 允許在 Actions 頁面手動按按鈕執行（測試用）

permissions:
  contents: write      # 讓流程可以把產出的 HTML 存回 repo

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行程式
        run: python twstock_group_heatmap.py

      - name: 整理輸出（最新一份 + 歷史紀錄）
        run: |
          mkdir -p docs/archive
          f=$(ls -t twstock_group_heatmap_*.html | head -1)
          cp "$f" docs/index.html
          mv "$f" docs/archive/
          python - <<'PY'
          import pathlib
          files = sorted(pathlib.Path("docs/archive").glob("twstock_group_heatmap_*.html"), reverse=True)
          items = "".join(
              f'<li><a href="{p.name}">{p.stem.split("_")[-1]}</a></li>' for p in files
          )
          page = (
              "<!doctype html><meta charset='utf-8'>"
              "<meta name='viewport' content='width=device-width,initial-scale=1'>"
              "<title>歷史熱力圖</title>"
              "<body style='background:#111;color:#eee;font-family:sans-serif;line-height:2'>"
              "<h2>歷史熱力圖</h2><p><a style='color:#6af' href='../'>← 回最新一份</a></p>"
              f"<ul>{items}</ul>"
          ).replace("<a href", "<a style='color:#6af' href")
          pathlib.Path("docs/archive/index.html").write_text(page, encoding="utf-8")
          PY

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "更新熱力圖 $(date +%F)"
          git push
