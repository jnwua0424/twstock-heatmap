name: 台股族群熱力圖

on:
  schedule:
    # GitHub 用 UTC 時間。避開整點（整點最塞，容易延遲好幾小時），並多排幾次重試。
    # 已經產出的日子程式會自動跳過，多跑不會重複。
    - cron: "17 8 * * 1-5"    # 台灣 16:17
    - cron: "43 10 * * 1-5"   # 台灣 18:43
    - cron: "37 13 * * 1-5"   # 台灣 21:37
    - cron: "7 1 * * 2-6"     # 台灣隔天 09:07（最後保險：前一天全部延誤時補上）
  workflow_dispatch:          # 在 Actions 頁面手動執行
    inputs:
      date:
        description: "補跑指定日期 YYYYMMDD（例如 20261012），留空＝抓最新"
        required: false
        default: ""

permissions:
  contents: write      # 讓流程可以把產出的 HTML 存回 repo

# 排程延遲時可能好幾次擠在一起跑，排隊一次一個，避免同時 push 互相衝突
concurrency:
  group: twstock-heatmap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # 鎖定版本，避免 ubuntu-latest 換版後環境改變
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行程式
        env:
          RUN_DATE: ${{ inputs.date }}
        run: |
          set +e
          python twstock_group_heatmap.py $RUN_DATE
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "::warning::還沒有新的交易日資料（尚未更新或休市），本次沒有產出檔案"
            exit 0
          fi
          exit $code

      - name: 整理輸出（最新一份 + 歷史紀錄）
        if: hashFiles('twstock_group_heatmap_*.html') != ''
        run: |
          # 記下這次產出的資料日期，給 commit 訊息用
          made=$(ls twstock_group_heatmap_*.html | sed 's/.*_\([0-9]\{8\}\)\.html/\1/' | tr '\n' ' ')
          echo "MADE=$made" >> "$GITHUB_ENV"
          mkdir -p docs/archive
          mv twstock_group_heatmap_*.html docs/archive/
          # 首頁永遠放「日期最新」的那份，補跑舊日期不會蓋掉首頁
          latest=$(ls docs/archive/twstock_group_heatmap_*.html | sort | tail -1)
          cp "$latest" docs/index.html
          python - <<'PY'
          import pathlib
          files = sorted(pathlib.Path("docs/archive").glob("twstock_group_heatmap_*.html"), reverse=True)
          items = "".join(
              f'<li><a href="{p.name}">{p.stem.split("_")[-1]}</a></li>' for p in files
          )
          page = (
              "<!doctype html><meta charset='utf-8'>"
              "<meta name='viewport' content='width=device-width,initial-scale=1'>"
              "<title>歷史熱力圖</title>"
              "<body style='background:#111;color:#eee;font-family:sans-serif;line-height:2'>"
              "<h2>歷史熱力圖</h2><p><a style='color:#6af' href='../'>← 回最新一份</a></p>"
              f"<ul>{items}</ul>"
          ).replace("<a href", "<a style='color:#6af' href")
          pathlib.Path("docs/archive/index.html").write_text(page, encoding="utf-8")
          PY

      - name: 存回 repo
        if: hashFiles('docs/archive/*.html') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "沒有變更，不用 commit"
            exit 0
          fi
          git commit -m "更新熱力圖 ${MADE:-$(date +%Y%m%d)}"
          # 萬一中間有別次執行先 push 了，先合併再推，最多試 3 次
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
